<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>排軸小抄</title>
  <link rel="stylesheet" href="styles.css?v=15">
  <script>
    (function () {
      var q = String(location.search || "") + String(location.hash || "");
      if (/OVERLAY_WS|HOST_PORT|OVERLAY/i.test(q)) document.documentElement.className += " as-overlay";
    })();
  </script>
</head>
<body class="mode-plan collapsed">
  <button type="button" id="peek" data-act="toggle-menu">小抄</button>
  <button type="button" id="end-preview" data-act="preview" hidden>結束預覽</button>
  <header class="top">
    <div class="brand">
      <p class="eyebrow">FFXIV · 繁中</p>
      <h1>排軸小抄</h1>
    </div>
  </header>

  <div class="toolbar">
    <label>這場
      <span class="job-pick">
        <button type="button" id="fight" data-act="fight-menu" aria-haspopup="listbox" aria-expanded="false" aria-label="這場">選這場</button>
        <div id="fight-menu" class="job-menu" hidden role="listbox"></div>
      </span>
    </label>
    <label>職業
      <span class="job-pick">
        <button type="button" id="job" data-act="plan-job-menu" aria-haspopup="listbox" aria-expanded="false" aria-label="職業">選職業</button>
        <div id="plan-job-menu" class="job-menu" hidden role="listbox"></div>
      </span>
    </label>
    <button type="button" data-act="preview" title="跳到第一招前幾秒，看倒數開始後的畫面。沒有聲音。">預覽倒數</button>
    <label title="小抄會早這幾秒把下一招放大。表上的時間仍是你按下技能的時間。">提前
      <input id="lead" type="number" min="0" max="10" step="0.5" value="2" aria-label="提前提醒秒數">
      秒
    </label>
    <button type="button" data-act="download" data-kind="json">下載排軸</button>
    <button type="button" data-act="import" title="可匯入多份。這場的清單裡選 boss 和職業">匯入</button>
    <input id="import-file" type="file" accept="application/json,.json" hidden>
  </div>
  <p id="status" class="status" role="status"></p>
  <p id="demo-note" class="demo-note" hidden>這是示範。表上的時間是按下技能的時間，提醒會再早幾秒。可以改，或按清空這場重排。</p>

  <div id="plan" class="plan">
    <main class="board">
      <div class="board-head">
        <div class="modes">
          <button type="button" id="group-time" data-act="group" data-group="time" aria-pressed="true">依時間</button>
          <button type="button" id="group-skill" data-act="group" data-group="skill" aria-pressed="false">依技能</button>
        </div>
      </div>
      <div id="timeline"></div>
      <div id="cast-list"></div>
    </main>
  </div>

  <section id="sheet" class="sheet" hidden>
    <div class="sheet-bar">
      <label class="sheet-job">職業
        <span class="job-pick">
          <button type="button" id="sheet-job" data-act="job-menu" aria-haspopup="listbox" aria-expanded="false" aria-label="畫面上的職業">選職業</button>
          <div id="sheet-job-menu" class="job-menu" hidden role="listbox"></div>
        </span>
      </label>
      <button type="button" data-act="preview" title="跳到第一招前幾秒，看倒數開始後的畫面。沒有聲音。">預覽倒數</button>
      <p id="clock">--:--</p>
      <p id="act-status">尚未開始</p>
      <button type="button" data-act="practice">開始練習</button>
      <button type="button" data-act="pause">暫停</button>
      <button type="button" data-act="reset-clock">重來</button>
      <button type="button" data-act="import">匯入</button>
      <button type="button" data-act="mode" data-mode="plan">微調排軸</button>
    </div>
    <p id="sheet-msg" class="sheet-msg"></p>
    <div class="hero wait" id="hero">
      <p id="hero-kicker"></p>
      <div id="hero-meter" class="meter" hidden><span id="hero-meter-fill"></span></div>
      <div id="hero-stack"></div>
      <p id="hero-warn"></p>
    </div>
    <ol id="next-two" class="next-two" hidden></ol>
    <ol id="sheet-list"></ol>
    <p class="hint sheet-hint">遊戲內職業和 boss 對得上才會展開倒數。對不上就縮小。點小鈕可以匯入或微調排軸。</p>
  </section>

  <script src="skills.js?v=15"></script>
  <script src="logic.js?v=15"></script>
  <script src="app.js?v=15"></script>
</body>
</html>
